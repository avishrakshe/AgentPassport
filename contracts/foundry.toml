[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
monad_testnet = "${ALCHEMY_MONAD_RPC_URL}"

[etherscan]
monad_testnet = { key = "", url = "https://testnet.monadscan.com/api", chain = 10143 }

[fuzz]
runs = 1000
