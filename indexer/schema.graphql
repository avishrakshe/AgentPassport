type Agent @entity {
  id: ID!
  wallet: String!
  agentId: String!
  metadataURI: String!
  cleanverseVerified: Boolean!
  registeredAt: BigInt!
  trustScore: BigInt!
  trustScoreFloat: Float!
  ratingCount: Int!
  ratingsReceived: [Rating!]! @derivedFrom(field: "rated")
  ratingsGiven: [Rating!]! @derivedFrom(field: "rater")
}

type Rating @entity {
  id: ID!
  rater: Agent!
  rated: Agent!
  score: Int!
  interactionHash: String!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: String!
}
